image:
  distribution: debian
  release: trixie
  description: Debian 13 container with Node.js 24, PostgreSQL 17, and Prisma CLI
  variant: default
  expiry: 30d

source:
  downloader: debootstrap
  url: https://deb.debian.org/debian/
  # Allows hosts with an older debootstrap package to bootstrap trixie.
  same_as: sid

files:
  - generator: hostname
    path: /etc/hostname

  - generator: hosts
    path: /etc/hosts

  # Without this the container boots with eth0 up but unmanaged: no DHCP
  # lease, no routes, and crabbox provisioning hangs before it can start.
  - generator: dump
    path: /etc/systemd/network/eth0.network
    content: |-
      [Match]
      Name=eth0

      [Network]
      DHCP=true

      [DHCPv4]
      UseDomains=true

  # ds-identify looks for /dev/lxd/sock, but incus exposes /dev/incus/sock,
  # so cloud-init disables itself and never runs the crabbox user-data.
  # Force the LXD datasource (a single-entry list skips detection).
  - generator: dump
    path: /etc/cloud/cloud.cfg.d/90_incus.cfg
    content: |-
      datasource_list: [ LXD ]

  # At boot: point resolv.conf at systemd-resolved (the build leaves an empty
  # file), and give cloud-init an lxd-named path to the incus guest socket.
  - generator: dump
    path: /etc/tmpfiles.d/incus-compat.conf
    content: |-
      L+ /etc/resolv.conf - - - - /run/systemd/resolve/stub-resolv.conf
      d /dev/lxd 0755 root root -
      L /dev/lxd/sock - - - - /dev/incus/sock

packages:
  manager: apt
  update: true
  cleanup: true
  sets:
    - action: install
      flags:
        - --no-install-recommends
      packages:
        - systemd
        - systemd-sysv
        - systemd-resolved
        - dbus
        # crabbox provisions instances through cloud-init user-data and then
        # connects over SSH; its readiness check needs git, rsync, and jq.
        - cloud-init
        - openssh-server
        - git
        - rsync
        - jq
        - ca-certificates
        - curl
        - gnupg
        - build-essential
        - python3
        - pkg-config
        - openssl
        - libssl-dev
        - postgresql-17
        - postgresql-client-17
        - postgresql-contrib
        - libpq-dev

actions:
  - trigger: post-packages
    action: |-
      #!/bin/sh
      set -eux

      # Install Node.js 24 from NodeSource's signed APT repository. Debian 13's
      # own nodejs package is intentionally not used because it is not Node 24.
      install -d -m 0755 /usr/share/keyrings
      curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
        | gpg --dearmor --yes -o /usr/share/keyrings/nodesource.gpg
      chmod 0644 /usr/share/keyrings/nodesource.gpg

      cat > /etc/apt/sources.list.d/nodesource.sources <<'EOF'
      Types: deb
      URIs: https://deb.nodesource.com/node_24.x
      Suites: nodistro
      Components: main
      Architectures: amd64 arm64
      Signed-By: /usr/share/keyrings/nodesource.gpg
      EOF

      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nodejs

      # A generated Prisma Client is schema-specific, so only the pinned CLI is
      # installed globally. The application can generate its client after its
      # source and dependencies are mounted or installed in the container.
      npm install --global prisma@7.9.1

      systemctl enable postgresql.service
      systemctl enable systemd-networkd.service systemd-resolved.service ssh.service

      node --version | grep -Eq '^v24\.'
      psql --version | grep -Eq ' 17\.'
      prisma --version

      npm cache clean --force
      rm -rf /root/.npm /var/lib/apt/lists/*

mappings:
  architecture_map: debian
